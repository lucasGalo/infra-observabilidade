apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: 'grafana'
        static_configs:
          - targets: ['grafana:3000']

      - job_name: 'loki'
        static_configs:
          - targets: ['loki:3100']

      - job_name: 'springboot-rabbitmq'
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets: ['springboot-rabbitmq:8082']
            labels:
              application: "springboot-rabbitmq"
