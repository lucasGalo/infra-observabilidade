apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.8.0
          args:
            - '-config.file=/etc/loki/loki.yml'
            - '-target=all'
          ports:
            - containerPort: 3100
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/loki.yml
              subPath: loki.yml
            - name: loki-data
              mountPath: /data/loki   # monta o diretório persistente
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: argocd
spec:
  type: NodePort   # muda de ClusterIP para NodePort
  selector:
    app: loki
  ports:
    - port: 3100          # porta interna do serviço
      targetPort: 3100    # porta do container
      nodePort: 30100     # porta exposta no Node (entre 30000-32767)

